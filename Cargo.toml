[package]
name = "dedupe"
version = "0.1.2"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
blake3 = "1"
xxhash-rust = { version = "0", features = ["xxh64"] }
walkdir = "2"
indicatif = "0.17"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.8"
num_cpus = "1.16"
same-file = "1"

[dev-dependencies]
tempfile = "3"
